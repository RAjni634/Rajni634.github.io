  <g transform="translate(60 520)"><ellipse cx="46" cy="96" rx="64" ry="12" fill="#000" opacity=".25" filter="url(#blur)"/><path d="M0 40H92C92 84 74 100 46 100C18 100 0 84 0 40Z" fill="#fbf8f2"/><path d="M92 50C112 50 112 80 88 80" stroke="#fbf8f2" stroke-width="7" fill="none"/><ellipse cx="46" cy="40" rx="46" ry="8" fill="#a97b45"/><rect x="0" y="52" width="92" height="6" fill="#b59a5b" opacity=".6"/><path d="M30 24C20 8 40 2 30 -14M56 24C46 8 66 2 56 -14" stroke="#fff" stroke-width="4" opacity=".7" fill="none" stroke-linecap="round"/></g>
