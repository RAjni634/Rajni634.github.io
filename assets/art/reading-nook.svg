<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a352b"/><stop offset="1" stop-color="#24211b"/></linearGradient>
    <linearGradient id="chair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b08a52"/><stop offset="1" stop-color="#6e5530"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3d3a6"/><stop offset="1" stop-color="#8d7843"/></linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f7d98b" stop-opacity=".7"/><stop offset="1" stop-color="#f7d98b" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="600" height="800" fill="url(#wall)"/>
  <!-- wall hairlines -->
  <path d="M0 360H600" stroke="#4a443a" stroke-width="2"/>
  <rect x="0" y="560" width="600" height="240" fill="#1b1814"/>
  <rect x="0" y="560" width="600" height="3" fill="#b59a5b" opacity=".5"/>
  <!-- framed art -->
  <g transform="translate(86 92)"><rect width="150" height="190" fill="#14120f" stroke="url(#gold)" stroke-width="3"/><rect x="14" y="14" width="122" height="162" fill="#efe6d2"/><circle cx="75" cy="86" r="38" fill="#b59a5b"/><path d="M14 176V130C50 110 100 120 136 100V176Z" fill="#8d7843"/></g>
  <g transform="translate(286 128)"><rect width="104" height="132" fill="#14120f" stroke="url(#gold)" stroke-width="3"/><rect x="10" y="10" width="84" height="112" fill="#f4efe6"/><path d="M26 100V60M42 100V36M58 100V48M74 100V70" stroke="#1a1917" stroke-width="6"/></g>
  <!-- window light -->
  <g transform="translate(430 70)"><rect width="130" height="250" fill="#f0e3bd" opacity=".16"/><path d="M65 0V250M0 125H130" stroke="#b59a5b" stroke-width="3" opacity=".5"/><rect width="130" height="250" fill="none" stroke="#b59a5b" stroke-width="3" opacity=".6"/></g>
  <!-- lamp -->
  <circle cx="100" cy="330" r="150" fill="url(#lamp)"/>
  <g stroke="#b59a5b" stroke-width="5" fill="none" stroke-linecap="round"><path d="M96 620V330C96 300 124 290 150 300"/></g>
  <path d="M120 270L186 292L170 330L106 306Z" fill="#efe6d2"/>
  <ellipse cx="96" cy="624" rx="40" ry="8" fill="#b59a5b"/>
  <!-- armchair -->
  <ellipse cx="350" cy="640" rx="200" ry="22" fill="#000" opacity=".5" filter="url(#blur)"/>
  <path d="M190 420C190 380 220 360 260 360H430C470 360 500 380 500 420V560H190Z" fill="url(#chair)"/>
  <path d="M170 470C170 440 190 430 210 440L230 450V590H190C176 590 170 580 170 570Z" fill="#8a6a3c"/>
  <path d="M520 470C520 440 500 430 480 440L460 450V590H500C514 590 520 580 520 570Z" fill="#8a6a3c"/>
  <rect x="226" y="480" width="238" height="84" rx="14" fill="#c59b60"/>
  <path d="M226 520H464" stroke="#8a6a3c" opacity=".5"/>
  <rect x="200" y="590" width="14" height="40" rx="3" fill="#2a2214"/><rect x="476" y="590" width="14" height="40" rx="3" fill="#2a2214"/>
  <!-- cushion -->
  <path d="M250 430L318 424L324 486L256 492Z" fill="#a0454b"/><path d="M250 430L318 424" stroke="#e3d3a6" stroke-width="2" opacity=".6"/>
  <!-- side table with books + cup -->
  <g transform="translate(46 520)"><rect x="0" y="40" width="96" height="10" rx="4" fill="#b59a5b"/><path d="M12 50V110M84 50V110" stroke="#8d7843" stroke-width="5"/>
    <rect x="6" y="14" width="80" height="14" fill="#15140f"/><rect x="12" y="2" width="68" height="12" fill="#efe6d2"/><rect x="6" y="26" width="84" height="14" fill="#8f3b42"/>
  </g>
  <g transform="translate(504 540)"><rect x="0" y="0" width="40" height="30" rx="6" fill="#efe6d2"/><path d="M40 6C52 6 52 24 40 24" stroke="#efe6d2" stroke-width="4" fill="none"/><path d="M12 -8C8 -16 16 -20 12 -28M26 -8C22 -16 30 -20 26 -28" stroke="#efe6d2" opacity=".5" fill="none"/></g>
</svg>
